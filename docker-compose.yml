# ---------------------------------------------------------------------------
# The whole application, described in one file.
#
# Three containers ("services") run together:
#
#   db       PostgreSQL 16  - stores everything
#   web      Django         - dashboard, updater, admin, API, and the pipeline
#   pgadmin  pgAdmin 4      - a web interface for browsing the database
#
# Start everything:   docker compose up -d --build
# Watch the logs:     docker compose logs -f web
# Stop everything:    docker compose down
#
# All passwords and ports come from the .env file next to this one. The
# ${NAME:-default} syntax means "use NAME from .env, or this default if unset".
# ---------------------------------------------------------------------------
# The Docker project name. Everything Docker creates is prefixed with it: the
# containers (communitycenteredhumanitariananalysis-db-1 and friends), the
# network, and - the part that matters - the two named volumes holding the
# database and pgAdmin's settings.
#
# It is written out rather than left to Compose because Compose would otherwise
# invent it from the folder name, and a future folder rename would then point at
# different volumes and the database would look empty. The value below is
# exactly what Compose derives from the folder "Community Centered Humanitarian
# Analysis" (lower-cased, spaces removed), so the two agree either way.
#
# This IS the name your data is stored under. Changing it starts a new, empty
# database, so only change it together with a volume migration.
name: communitycenteredhumanitariananalysis

services:

  # ------------------------------------------------------------------ database
  db:
    # PostGIS rather than plain PostgreSQL, because the boundary library stores
    # real geometry: QGIS, DBeaver and Power BI open admin_areas as a map layer,
    # and the database can answer spatial questions itself ("which district
    # contains this point?") instead of the answer being computed in Python.
    #
    # This image IS postgres:16 with the PostGIS extension added. The on-disk
    # layout is identical, so the pgdata volume below carries over untouched -
    # no dump-and-restore was needed to adopt it.
    #
    # Going back to postgres:16-alpine is NOT just a tag change once geometry
    # columns exist: they depend on the extension, and a plain server cannot
    # read them. See the rollback section of the boundary library spec.
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sudan_neighbouring_pop_movement}
      POSTGRES_USER: ${POSTGRES_USER:-sudan}
      # ":?" means Compose refuses to start if this is unset or empty. There is
      # deliberately no default: a default password in a public repository is
      # not a password. Copy env.example to .env and set one.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (copy it from env.example)}
    volumes:
      # A named volume, NOT a folder on your disk. This repository lives in a
      # OneDrive-synced folder, and letting OneDrive sync live database files
      # corrupts them. Docker keeps this volume safely outside that folder.
      - pgdata:/var/lib/postgresql/data
    ports:
      # Exposed so you can also connect with psql, DBeaver or Power BI.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      # "Is the database actually ready?" - the web container waits for a yes.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sudan} -d ${POSTGRES_DB:-sudan_neighbouring_pop_movement}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ------------------------------------------------------------------ Django
  web:
    build: "./Community Centered Humanitarian Analysis Platform"
    # tini becomes PID 1 inside this container instead of gunicorn. Without it,
    # a detached child launched by the "Run extraction now" Admin action
    # (insights/admin.py, start_new_session=True) that outlives its worker
    # reparents straight to gunicorn's own Arbiter.reap_workers(), which halts
    # the whole server if that child happens to exit 3 or 4 - gunicorn's own
    # WORKER_BOOT_ERROR / APP_LOAD_ERROR codes, misread off a pid that was
    # never gunicorn's. See task-13-rulings.md §6b (R13c) for the full trace.
    init: true
    environment:
      # Database connection. Inside Docker the host is always the "db" service.
      POSTGRES_DB: ${POSTGRES_DB:-sudan_neighbouring_pop_movement}
      POSTGRES_USER: ${POSTGRES_USER:-sudan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (copy it from env.example)}
      # "db" is the PostgreSQL container below. Point POSTGRES_HOST at your own
      # server in .env and this app uses that instead - nothing else changes.
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}

      # Django behaviour.
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DASHBOARD_URL: ${DASHBOARD_URL:-/}
      TZ: ${TZ:-UTC}

      # Optional in-container insight extraction. Leave unset to run extraction
      # with an agent on the host instead. For a local model, point LLM_BASE_URL
      # at http://host.docker.internal:11434/v1 and set LLM_PROVIDER to
      # openai_compatible.
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}

      # Keys for the MCP pull buttons. Unset is fine: those buttons are then
      # disabled and say so. See env.example for where each one comes from.
      IPC_API_KEY: ${IPC_API_KEY:-}
      HDX_API_TOKEN: ${HDX_API_TOKEN:-}
      # Montandon is not an open API - without this the eight montandon rows
      # say "needs IFRC_API_TOKEN in .env" and call nothing. MONTANDON_STAC_URL
      # defaults to staging; production wants IFRC GO OIDC credentials.
      IFRC_API_TOKEN: ${IFRC_API_TOKEN:-}
      MONTANDON_STAC_URL: ${MONTANDON_STAC_URL:-}

      # The basemap drawn under the dashboard: the shared IFRC GO style on
      # Mapbox. Both defaults are the public values published by GO itself
      # (https://go-wiki.ifrc.org/en/user_guide/Maps), so this works untouched;
      # set them in .env only to point at a different style or a rotated token.
      MAPBOX_STYLE_URL: ${MAPBOX_STYLE_URL:-}
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}

      # Optional /admin/ login, created on first start when a password is set.
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.org}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}

      # Where the data lives inside the container (see the volumes below).
      # Only the source PDFs and the Excel sit outside the app, under /work.
      # Everything the dashboard serves is inside Django itself, under /app.
      SOURCE_ROOT: ${SOURCE_ROOT:-/work}
      DASHBOARD_DATA_DIR: ${DASHBOARD_DATA_DIR:-/app/dashboard/data}
      MCP_CACHE_DIR: ${MCP_CACHE_DIR:-/app/data_pipeline/mcp_cache}
      POP_MOVEMENT_XLSX: ${POP_MOVEMENT_XLSX:-/work/neighbouring countries Pop movement data.xlsx}

      # Where the boundary library reads its source files from, inside the
      # container. These match mounts 4-6 below. They are read once, by
      # "manage.py load_boundaries"; nothing at runtime opens them.
      BOUNDARY_ADMIN_DIR: ${BOUNDARY_ADMIN_DIR:-/boundary-src/chad-maps/Countries Maps}
      BOUNDARY_LAYERS_DIR: ${BOUNDARY_LAYERS_DIR:-/boundary-src/layers}
      BOUNDARY_ICONS_DIR: ${BOUNDARY_ICONS_DIR:-/boundary-src/icons}
      HSP_XLSX: ${HSP_XLSX:-/boundary-src/chad-maps/Humanitarian_Service_Points_Mapping_-_all_versions_-_labels_-_2026-09-08-11-46-14.xlsx}
    volumes:
      # 1. The folder holding the source documents, READ-ONLY: the pipeline
      #    reads the source PDFs and the Excel from here and writes nothing
      #    back. The dashboard files it produces live inside the app, in mount 2.
      #
      #    The host side is a variable because this platform is deployed against
      #    different folders in different places; the container path stays /work,
      #    so nothing else has to change when it moves. The default is the parent
      #    of this repository, which is the "SUDAN Ops" folder it was built in.
      - "${SOURCE_HOST_DIR:-..}:/work:ro"
      # 2. The Django project - code, templates, static files and the
      #    dashboard's data/ folder. Edits on your machine take effect without
      #    rebuilding the image, and the pipeline's output lands here.
      - "./Community Centered Humanitarian Analysis Platform:/app"
      # 3. The docs folder, writable, so the Word manual can be rebuilt from
      #    inside the container:  docker compose exec web python /docs/build_docs.py
      #    (mount 1 is read-only, so the manual cannot be written through /work.)
      - "./docs:/docs"
      # 4-6. The boundary library's sources, READ-ONLY. They sit outside the
      #      "SUDAN Ops" folder that mount 1 covers - two of them on entirely
      #      different shares - so they need mounts of their own. They are read
      #      once, by "manage.py load_boundaries", and never at runtime.
      #
      #      Override any of these in .env if the folders move; the container
      #      paths they land on stay the same, so nothing else changes.
      #      Four "..", not five: this file sits in PoP MVT Tracker, and four
      #      levels up is "Sudan Crisis - Chad 2026", where Chad Maps lives.
      - "${BOUNDARY_SRC_CHAD_MAPS:-../../../../Chad Maps}:/boundary-src/chad-maps:ro"
      - "${BOUNDARY_SRC_LAYERS:-../../../../../Nigeria Malnutrition 2025/HDCC Africa-1 Disaster Preparedness and Response - 08. IM/01. Maps/QGIS_Template_2024/layers}:/boundary-src/layers:ro"
      #      Absolute, because the icons are on a different drive root again and
      #      Compose does not expand "~" inside a volume path.
      - "${BOUNDARY_SRC_ICONS:-C:/Users/Admin/Dropbox/icons/Colour/png}:/boundary-src/icons:ro"
    ports:
      - "${WEB_HOST_PORT:-2026}:8000"
    depends_on:
      db:
        condition: service_healthy   # wait until the healthcheck above passes
    restart: unless-stopped

  # ------------------------------------------------------------------ pgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-pgadmin}
      # Skip the "master password" prompt - the login above is enough locally.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # Pre-registers the population movement server, so it is already in the
      # sidebar when you log in. You still type the database password once.
      - ./docker/pgadmin_servers.json:/pgadmin4/servers.json:ro
    ports:
      - "${PGADMIN_HOST_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

# Named volumes: Docker manages these, and they survive "docker compose down".
# Removing them (and all data) takes "docker compose down -v".
volumes:
  pgdata:
  pgadmin_data:
